[package]
# O nome é o que a peça faz: ela inicia o Duke. Não é um estágio de boot
# genérico nem um gerenciador de inicialização — é o programa que a UEFI
# executa para pôr este kernel de pé, e só ele.
name = "iniciador"
version = "0.1.0"
edition = "2024"
description = "Iniciador UEFI do Duke: a aplicação EFI que carrega o kernel"
license = "MIT OR Apache-2.0"

# Workspace próprio, pela mesma razão do kernel: ele compila para
# `x86_64-unknown-uefi`, que não é o alvo de nenhum outro pacote daqui. Um
# workspace só não consegue ter dois alvos padrão.
[workspace]

[dependencies]
# A ABI com o kernel: o que é entregue a ele e onde cada coisa mora no espaço
# virtual. Ver `protocolo/src/lib.rs` sobre por que é um pacote.
protocolo = { path = "../protocolo" }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
debug = true
# Estouro aritmético para o kernel, e não silêncio.
#
# O padrão do Rust em release é dar a volta: `a + b` que não cabe vira um
# número menor, sem aviso. Num programa comum isso é uma conta errada; num
# kernel é um tamanho que vira índice fora da faixa, ou um endereço que
# aponta para memória de outra pessoa — e o sintoma aparece páginas depois,
# sem nada que ligue uma coisa à outra.
#
# Parar é melhor. Este kernel tem modo post-mortem: uma parada vira um canal
# aberto com a mensagem exata e o `pc`, que é incomparavelmente mais útil
# que um número errado seguindo adiante.
#
# Medido antes de ligar: a suíte inteira passa em release com a checagem
# ativa, nas duas arquiteturas, 155 casos cada. Nenhum caminho exercitado
# hoje depende de dar a volta.
overflow-checks = true

