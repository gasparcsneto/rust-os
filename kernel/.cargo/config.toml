# Alvo padrão quando se roda `cargo build` de dentro de `kernel/`.
#
# Usamos o target oficial `x86_64-unknown-none` (tier 2) em vez de um arquivo
# de target JSON customizado: ele já vem com `core` e `alloc` pré-compilados,
# o que dispensa `-Z build-std` e deixa o build muito mais rápido e estável.
#
# Para ARM, use `cargo xtask build --arch aarch64` (ou passe `--target`).
[build]
target = "x86_64-unknown-none"

# As primitivas do canal seguro em software, sem SIMD.
#
# O ChaCha20, o Poly1305 e o curve25519 do RustCrypto, no x86_64, conferem em
# tempo de execução se o processador tem AVX2 ou SSE2 e, tendo, usam. Num
# programa comum é o certo. Num kernel não: os registradores de SIMD são do
# processo que estava rodando, este kernel não os salva ao entrar, e uma
# função de cifra que os usasse corromperia o estado de quem foi
# interrompido — sem erro nenhum, só números errados num programa que nem
# sabia que tinha sido interrompido.
#
# O alvo `x86_64-unknown-none` já proíbe o compilador de gerar SIMD por
# conta própria, mas não alcança o código que pede SIMD explicitamente,
# função a função, depois de perguntar ao processador. Estas opções são as
# que os próprios pacotes oferecem para desligar esse caminho. A do SHA-2
# entrou com o Ed25519 das assinaturas de quórum: sem ela, o `sha2` não
# compila para este alvo.
#
# Medido, tirando uma de cada vez: sem a do Poly1305, o LLVM não compila o
# caminho AVX2 para este alvo ("Do not know how to split the result of this
# operator"); sem a do curve25519, o próprio rustc morre com SIGILL; sem a
# do ChaCha20, compila, e nenhuma instrução de SIMD sai — o pacote não
# chega a gerá-las aqui. Ou seja: hoje elas são o que faz estes pacotes
# compilarem para o kernel, e o defeito de "SIMD dentro do kernel" não
# chegaria ao binário. A conferência do `xtask` — `conferir_sem_simd` — é
# para a versão seguinte de um destes pacotes, que pode compilar e gerar.
#
# No ARM o alvo `-softfloat` já não deixa o NEON existir; as opções são as
# mesmas lá para a escolha estar escrita, e não depender de um detalhe do
# alvo.
[target.x86_64-unknown-none]
rustflags = [
    "--cfg", 'chacha20_backend="soft"',
    "--cfg", 'poly1305_backend="soft"',
    "--cfg", 'curve25519_dalek_backend="serial"',
    "--cfg", 'sha2_backend="soft"',
]

[target.aarch64-unknown-none-softfloat]
# No ARM o kernel é ligado num endereço fixo, e o layout é responsabilidade
# nossa: o script define onde o kernel é carregado, onde o BSS começa e
# termina, e onde fica a pilha inicial. Não é uma escolha de conveniência —
# pelo protocolo de imagem crua do arm64 não há carregador nenhum para
# posicionar coisa alguma, e o iniciador UEFI, que existe, carrega a imagem
# exatamente no endereço em que ela foi ligada, porque o kernel do ARM não é
# independente de posição.
#
# Escolhemos o alvo `-softfloat` de propósito: ele proíbe o compilador de usar
# registradores de ponto flutuante e NEON. Num kernel isso é desejável, porque
# usar FP/SIMD em EL1 sem antes habilitar o acesso (CPACR_EL1) gera uma
# exceção — um bug sutil e difícil de rastrear.
rustflags = [
    "-C", "link-arg=-Tsrc/arch/aarch64/linker.ld",
    "--cfg", 'chacha20_backend="soft"',
    "--cfg", 'poly1305_backend="soft"',
    "--cfg", 'curve25519_dalek_backend="serial"',
    "--cfg", 'sha2_backend="soft"',
]
