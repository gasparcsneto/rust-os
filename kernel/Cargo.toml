[package]
name = "kernel"
version = "0.1.0"
edition = "2024"
description = "Kernel agent-native em Rust para x86_64 e aarch64"
license = "MIT OR Apache-2.0"

# O kernel é seu próprio workspace (ver comentário no Cargo.toml da raiz):
# ele compila para bare-metal, o `xtask` compila para o host.
[workspace]

[features]
# Troca o laço do agente por um executor de testes que roda dentro do
# emulador e o encerra com um código de saída. É assim que a suíte roda em
# CI: o kernel é seu próprio test harness, porque `cargo test` depende da
# `std` e de um sistema operacional por baixo — coisas que não temos.
modo-teste = []

[dependencies]
# Primitivas de sincronização baseadas em spinlock. Num kernel não existe
# scheduler para bloquear uma thread, então `std::sync::Mutex` não se aplica.
# É a única dependência comum às duas arquiteturas.
spin = "0.12.3"

# --- x86_64 -----------------------------------------------------------------
#
# No x86 nos apoiamos em crates maduros porque a plataforma tem décadas de
# peculiaridades acumuladas (GDT, IDT, portas de I/O legadas) que não vale a
# pena reimplementar.
[target.'cfg(target_arch = "x86_64")'.dependencies]
# Define o contrato com o bootloader: a assinatura do entry point e a struct
# `BootInfo` (mapa de memória, framebuffer, offset da memória física).
# Atenção: este crate é x86_64-only — daí o port ARM ter boot próprio.
bootloader_api = "0.11.17"

# Abstrações seguras sobre instruções e estruturas do x86_64.
x86_64 = "0.15.5"

# Driver da UART 16550, acessada por portas de I/O (PIO).
uart_16550 = "0.8.1"

# --- aarch64 ----------------------------------------------------------------
#
# Não há equivalente ao `bootloader` para aarch64, então o boot, o leitor de
# device tree e a tabela de vetores continuam escritos à mão — são protocolo e
# estrutura, não aritmética de bits, e a implementação direta é mais clara que
# uma abstração de terceiros.
#
# O que *não* vale escrever à mão é montar palavras de configuração a partir
# de deslocamentos lidos do manual da arquitetura. Um bit errado em `TCR_EL1`
# ou `SCTLR_EL1` não dá erro de compilação nem mensagem: dá uma máquina que
# se comporta de um jeito sutilmente errado. Estes dois crates trocam essa
# aritmética por campos com nome, verificáveis pela leitura.

[target.'cfg(target_arch = "aarch64")'.dependencies]
# Registradores de sistema do ARMv8-A com campos tipados: `TCR_EL1::TG0::KiB_4`
# em vez de `0b00 << 14`, `ESR_EL1::EC` em vez de `(esr >> 26) & 0x3F`.
aarch64-cpu = "11.2.0"

# Blocos de registradores mapeados em memória, com layout conferido em tempo
# de compilação. `register_structs!` exige que todo intervalo entre dois
# registradores seja declarado, o que transforma um deslocamento errado — hoje
# uma constante solta — em erro de compilação.
tock-registers = "0.10.1"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
# Símbolos preservados: sem eles não conseguimos resolver stack traces do
# kernel, e um kernel sem stack trace é um kernel impossível de depurar.
debug = true
