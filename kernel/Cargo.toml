[package]
# O nome do pacote é o nome do sistema. Não é só estética: ele vira o prefixo
# de todo símbolo do binário (`duke::tarefas::Tarefa`), o nome do ELF que o
# depurador carrega e o valor do campo `kernel` que `agent.describe` e
# `system.info` reportam pelo canal do agente. Um único lugar define os três.
name = "duke"
version = "0.1.0"
edition = "2024"
description = "Duke: kernel agent-native em Rust para x86_64 e aarch64"
license = "MIT OR Apache-2.0"

# O kernel é seu próprio workspace (ver comentário no Cargo.toml da raiz):
# ele compila para bare-metal, o `xtask` compila para o host.
[workspace]

[features]
# Troca o laço do agente por um executor de testes que roda dentro do
# emulador e o encerra com um código de saída. É assim que a suíte roda em
# CI: o kernel é seu próprio test harness, porque `cargo test` depende da
# `std` e de um sistema operacional por baixo — coisas que não temos.
modo-teste = []

[dependencies]
# O contrato com o iniciador UEFI: o que ele entrega ao kernel e onde cada
# coisa mora no espaço virtual. Declarado num pacote, e não nos dois lados,
# porque duas declarações iguais são duas que podem divergir — e o preço de
# divergirem aqui é uma máquina que reinicia no primeiro salto.
#
# Vale para as duas arquiteturas desde que o iniciador passou a subir no ARM
# também. Lá ele convive com o protocolo de imagem crua do arm64: o kernel
# distingue os dois pela magia que cada um põe em `x0`.
protocolo = { path = "../protocolo" }

pci_types = "0.10.1"

# Blocos de registradores mapeados em memória, com layout conferido em tempo
# de compilação. `register_structs!` exige que todo intervalo entre dois
# registradores seja declarado, o que transforma um deslocamento errado — que
# de outra forma seria uma constante solta — em erro de compilação.
#
# Comum às duas arquiteturas desde que o x86 ganhou o APIC local: ele é um
# bloco mapeado em memória como o GIC, com a mesma armadilha de registradores
# espaçados de dezesseis em dezesseis bytes. Usar o mesmo mecanismo nos dois
# lados é o que faz um leitor do GIC reconhecer o APIC.
tock-registers = "0.10.1"

# A fonte, os estilos e o desenho de texto: os mesmos dos programas de
# usuário, num pacote só — ver `tipografia/src/lib.rs` para a fonte, e por
# que ela vem de biblioteca. Sem as padrão: o título de 24 pixels é dos
# programas, e o kernel não carrega a massa de dados dele.
tipografia = { path = "../tipografia", default-features = false }

# Primitivas de sincronização baseadas em spinlock. Num kernel não existe
# scheduler para bloquear uma thread, então `std::sync::Mutex` não se aplica.
spin = "0.12.3"

# --- x86_64 -----------------------------------------------------------------
#
# No x86 nos apoiamos em crates maduros porque a plataforma tem décadas de
# peculiaridades acumuladas (GDT, IDT, portas de I/O legadas) que não vale a
# pena reimplementar.

[target.'cfg(target_arch = "x86_64")'.dependencies]
# Abstrações seguras sobre instruções e estruturas do x86_64.
x86_64 = "0.15.5"

# Driver da UART 16550, acessada por portas de I/O (PIO).
uart_16550 = "0.8.1"

# --- aarch64 ----------------------------------------------------------------
#
# Não há equivalente ao `bootloader` para aarch64, então o boot, o leitor de
# device tree e a tabela de vetores continuam escritos à mão — são protocolo e
# estrutura, não aritmética de bits, e a implementação direta é mais clara que
# uma abstração de terceiros.
#
# O que *não* vale escrever à mão é montar palavras de configuração a partir
# de deslocamentos lidos do manual da arquitetura. Um bit errado em `TCR_EL1`
# ou `SCTLR_EL1` não dá erro de compilação nem mensagem: dá uma máquina que
# se comporta de um jeito sutilmente errado. O crate abaixo, junto com o
# `tock-registers` comum às duas arquiteturas, troca essa aritmética por
# campos com nome, verificáveis pela leitura.

[target.'cfg(target_arch = "aarch64")'.dependencies]
# Registradores de sistema do ARMv8-A com campos tipados: `TCR_EL1::TG0::KiB_4`
# em vez de `0b00 << 14`, `ESR_EL1::EC` em vez de `(esr >> 26) & 0x3F`.
aarch64-cpu = "11.2.0"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
# Símbolos preservados: sem eles não conseguimos resolver stack traces do
# kernel, e um kernel sem stack trace é um kernel impossível de depurar.
debug = true
# Estouro aritmético para o kernel, e não silêncio.
#
# O padrão do Rust em release é dar a volta: `a + b` que não cabe vira um
# número menor, sem aviso. Num programa comum isso é uma conta errada; num
# kernel é um tamanho que vira índice fora da faixa, ou um endereço que
# aponta para memória de outra pessoa — e o sintoma aparece páginas depois,
# sem nada que ligue uma coisa à outra.
#
# Parar é melhor. Este kernel tem modo post-mortem: uma parada vira um canal
# aberto com a mensagem exata e o `pc`, que é incomparavelmente mais útil
# que um número errado seguindo adiante.
#
# Medido antes de ligar: a suíte inteira passa em release com a checagem
# ativa, nas duas arquiteturas, 155 casos cada. Nenhum caminho exercitado
# hoje depende de dar a volta.
overflow-checks = true

