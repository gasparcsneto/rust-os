[package]
# O nome do pacote é o nome do sistema. Não é só estética: ele vira o prefixo
# de todo símbolo do binário (`duke::tarefas::Tarefa`), o nome do ELF que o
# depurador carrega e o valor do campo `kernel` que `agent.describe` e
# `system.info` reportam pelo canal do agente. Um único lugar define os três.
name = "duke"
version = "0.1.0"
edition = "2024"
description = "Duke: kernel agent-native em Rust para x86_64 e aarch64"
license = "MIT OR Apache-2.0"

# O kernel é seu próprio workspace (ver comentário no Cargo.toml da raiz):
# ele compila para bare-metal, o `xtask` compila para o host.
[workspace]

[features]
# Troca o laço do agente por um executor de testes que roda dentro do
# emulador e o encerra com um código de saída. É assim que a suíte roda em
# CI: o kernel é seu próprio test harness, porque `cargo test` depende da
# `std` e de um sistema operacional por baixo — coisas que não temos.
modo-teste = ["protocolo/arrays"]

# Só para a bancada de persistência: quedas de energia em pontos exatos da
# gravação, num plano lido do fim da partição de estado — ver
# `src/quedas.rs`. Nenhuma outra compilação a pede, e o `cargo xtask
# invariantes` confere.
quedas = []

[dependencies]
# O contrato com o iniciador UEFI: o que ele entrega ao kernel e onde cada
# coisa mora no espaço virtual. Declarado num pacote, e não nos dois lados,
# porque duas declarações iguais são duas que podem divergir — e o preço de
# divergirem aqui é uma máquina que reinicia no primeiro salto.
#
# Vale para as duas arquiteturas desde que o iniciador passou a subir no ARM
# também. Lá ele convive com o protocolo de imagem crua do arm64: o kernel
# distingue os dois pela magia que cada um põe em `x0`.
# `arrays`: um lote do armazém (`fs.batch`) chega como lista — entrada
# hostil, lida pelo mesmo leitor que pula strings e contêineres aninhados,
# e com teto de itens.
protocolo = { path = "../protocolo", features = ["alloc", "arrays"] }

pci_types = "0.10.1"

# Blocos de registradores mapeados em memória, com layout conferido em tempo
# de compilação. `register_structs!` exige que todo intervalo entre dois
# registradores seja declarado, o que transforma um deslocamento errado — que
# de outra forma seria uma constante solta — em erro de compilação.
#
# Comum às duas arquiteturas desde que o x86 ganhou o APIC local: ele é um
# bloco mapeado em memória como o GIC, com a mesma armadilha de registradores
# espaçados de dezesseis em dezesseis bytes. Usar o mesmo mecanismo nos dois
# lados é o que faz um leitor do GIC reconhecer o APIC.
tock-registers = "0.10.1"

# A fonte, os estilos e o desenho de texto: os mesmos dos programas de
# usuário, num pacote só — ver `tipografia/src/lib.rs` para a fonte, e por
# que ela vem de biblioteca. Sem as padrão: o título de 24 pixels é dos
# programas, e o kernel não carrega a massa de dados dele.
tipografia = { path = "../tipografia", default-features = false }

# A linguagem visual — a paleta, as medidas e os estilos pelo uso: a mesma
# dos programas — ver `aparencia/src/lib.rs`. Sem as padrão, pelo título de
# 24 pixels, como a tipografia.
aparencia = { path = "../aparencia", default-features = false }

# A exclusão mútua do kernel é a trava própria dele, justa entre núcleos —
# ver `src/trava.rs` sobre por que não a do `spin`. Do `spin` sobra só o
# `Once` do backend x86, e por isso ele é dependência só de lá.

# O canal seguro das portas de agente: o Noise, a prova administrativa e o
# gerador de números aleatórios. Um pacote compartilhado com o cliente, pela
# razão do `protocolo`: os dois lados da conversa fazem a mesma conta.
#
# Ele traz as primitivas do RustCrypto, que no x86 escolhem SIMD em tempo de
# execução. Num kernel isso não pode acontecer — ver `.cargo/config.toml`,
# que força as versões em software.
sigilo = { path = "../sigilo" }

# A política de autorização: o vocabulário das permissões, a decisão, o balde
# de taxa e a cadeia da auditoria. Compartilhada com o `xtask`, que escreve a
# política na imagem e recalcula a cadeia de fora.
politica = { path = "../politica" }

# A âncora da persistência: os comandos do TPM e o contador monotônico —
# ver `ancora/src/lib.rs`. O transporte até o chip é do kernel (`tpm.rs`).
ancora = { path = "../ancora" }

# O journal da persistência: o formato, a leitura que confere cada
# registro e o julgamento contra a âncora — ver `diario/src/lib.rs`. O
# disco é do kernel (`persistencia.rs`).
diario = { path = "../diario" }

# O armazém, como conta pura: caminhos, versões, tetos, preparar e aplicar
# — ver `armazem/src/lib.rs`. A autorização, o arrendamento, a persistência
# e a auditoria são do kernel (`armazem.rs`), cada um no lugar dele.
armazem = { path = "../armazem" }
# O tecido nativo de segurança: as contas do NSF e do firewall — ver
# `docs/SEGURANCA.md`. O kernel põe o fio, as leituras pelo gate e os
# pedidos; nada do pacote decide acesso.
seguranca = { path = "../seguranca" }

# A pilha IP: Ethernet, ARP, IPv4, DHCP, TCP e UDP sobre a placa virtio —
# ver `src/rede/pilha.rs`. Escrever TCP do zero é um a dois anos-pessoa e
# não diferencia o Duke em nada; o que diferencia é o lado de cima, a
# conexão como capacidade do registro, sob o gate — e esse é do kernel
# (`src/rede/conexoes.rs`). Só o que este kernel usa: sem `std`, sem log,
# sem IPv6, sem DNS por enquanto, sem os dispositivos de exemplo. O UDP é o
# da associação com um destino só, a mesma capacidade com datagramas. E
# com `async`: o socket guarda o waker de quem espera a leitura e o aciona
# quando o dado chega ou o estado muda — é o evento por que um `net.recv`
# espera (`src/rede/espera.rs`).
smoltcp = { version = "0.14.0", default-features = false, features = [
    "alloc",
    "async",
    "medium-ethernet",
    "proto-ipv4",
    "proto-dhcpv4",
    "socket-tcp",
    "socket-udp",
    "socket-dhcpv4",
] }

# --- x86_64 -----------------------------------------------------------------
#
# No x86 nos apoiamos em crates maduros porque a plataforma tem décadas de
# peculiaridades acumuladas (GDT, IDT, portas de I/O legadas) que não vale a
# pena reimplementar.

[target.'cfg(target_arch = "x86_64")'.dependencies]
# Abstrações seguras sobre instruções e estruturas do x86_64.
x86_64 = "0.15.5"
# Inicialização única da GDT e da IDT (`spin::once::Once`).
#
# Só o `Once`: sem as travas do pacote (`Mutex`, `RwLock`, `lock_api`).
# Toda trava do kernel é a `trava::Mutex`, que passa pela conferência da
# ordem das travas na suíte e pelo destravamento do caminho fatal; uma
# `spin::Mutex` escaparia das duas sem que nada reclamasse. Assim ela não
# compila.
spin = { version = "0.12.3", default-features = false, features = ["once"] }

# Driver da UART 16550, acessada por portas de I/O (PIO).
uart_16550 = "0.8.1"

# --- aarch64 ----------------------------------------------------------------
#
# Não há equivalente ao `bootloader` para aarch64, então o boot, o leitor de
# device tree e a tabela de vetores continuam escritos à mão — são protocolo e
# estrutura, não aritmética de bits, e a implementação direta é mais clara que
# uma abstração de terceiros.
#
# O que *não* vale escrever à mão é montar palavras de configuração a partir
# de deslocamentos lidos do manual da arquitetura. Um bit errado em `TCR_EL1`
# ou `SCTLR_EL1` não dá erro de compilação nem mensagem: dá uma máquina que
# se comporta de um jeito sutilmente errado. O crate abaixo, junto com o
# `tock-registers` comum às duas arquiteturas, troca essa aritmética por
# campos com nome, verificáveis pela leitura.

[target.'cfg(target_arch = "aarch64")'.dependencies]
# Registradores de sistema do ARMv8-A com campos tipados: `TCR_EL1::TG0::KiB_4`
# em vez de `0b00 << 14`, `ESR_EL1::EC` em vez de `(esr >> 26) & 0x3F`.
aarch64-cpu = "11.2.0"

[profile.dev]
panic = "abort"

# As primitivas do canal seguro otimizadas mesmo no build de depuração.
#
# Sem otimização, o X25519 é aritmética de 255 bits feita por funções que
# nunca são inlinadas: medido, um aperto de mão inteiro — os dois lados, na
# suíte — levava duzentos e dez milissegundos. Com elas otimizadas, ver o
# número no commit que trouxe estas linhas. O código do kernel continua sem
# otimização, que é o que importa para depurar: ninguém põe um ponto de
# parada dentro do ChaCha20.
[profile.dev.package.curve25519-dalek]
opt-level = 3
[profile.dev.package.x25519-dalek]
opt-level = 3
[profile.dev.package.chacha20]
opt-level = 3
[profile.dev.package.chacha20poly1305]
opt-level = 3
[profile.dev.package.poly1305]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.sigilo]
opt-level = 3
# O Argon2id da credencial das pessoas: sem otimização, o login esperaria
# segundos por um cálculo que é de propósito caro.
[profile.dev.package.argon2]
opt-level = 3
# A sessão autenticada com o TPM: um ECDH em P-256 a cada conexão, e um
# HMAC por comando. Sem otimização, a multiplicação escalar da curva vira
# segundos na suíte — que conecta ao TPM a cada boot simulado.
[profile.dev.package.p256]
opt-level = 3
[profile.dev.package.primeorder]
opt-level = 3
[profile.dev.package.elliptic-curve]
opt-level = 3
[profile.dev.package.crypto-bigint]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.hmac]
opt-level = 3
[profile.dev.package.aes]
opt-level = 3
[profile.dev.package.cfb-mode]
opt-level = 3

[profile.release]
panic = "abort"
# Símbolos preservados: sem eles não conseguimos resolver stack traces do
# kernel, e um kernel sem stack trace é um kernel impossível de depurar.
debug = true
# Estouro aritmético para o kernel, e não silêncio.
#
# O padrão do Rust em release é dar a volta: `a + b` que não cabe vira um
# número menor, sem aviso. Num programa comum isso é uma conta errada; num
# kernel é um tamanho que vira índice fora da faixa, ou um endereço que
# aponta para memória de outra pessoa — e o sintoma aparece páginas depois,
# sem nada que ligue uma coisa à outra.
#
# Parar é melhor. Este kernel tem modo post-mortem: uma parada vira um canal
# aberto com a mensagem exata e o `pc`, que é incomparavelmente mais útil
# que um número errado seguindo adiante.
#
# Medido antes de ligar: a suíte inteira passa em release com a checagem
# ativa, nas duas arquiteturas, 155 casos cada. Nenhum caminho exercitado
# hoje depende de dar a volta.
overflow-checks = true

