[package]
# Os programas de usuário do Duke, compilados à parte do kernel.
#
# Um workspace próprio, como o `kernel` e o `iniciador`, e pelo mesmo motivo:
# o alvo padrão é outro, e o ligador precisa de um script próprio — o
# executável mora no espaço do usuário, e não onde o kernel mora.
#
# A biblioteca é o runtime (a entrada, as chamadas de sistema, o monte e a
# saída); cada arquivo em `src/bin` é um programa, e o `xtask` põe cada um no
# disco, em `/programas`.
name = "programas"
version = "0.1.0"
edition = "2024"
description = "Os programas de usuário do Duke e o runtime que eles usam"
license = "MIT OR Apache-2.0"

[lib]
test = false
doctest = false
bench = false

[dependencies]
# Os números das chamadas de sistema, os erros e o mapa do espaço do
# usuário: a mesma declaração que o kernel inclui.
protocolo = { path = "../protocolo", features = ["arrays"] }

# A fonte e o desenho de texto: os mesmos do kernel — ver
# `tipografia/src/lib.rs`.
tipografia = { path = "../tipografia" }

# A linguagem visual — a paleta, as medidas e os estilos pelo uso: a mesma
# do kernel. Ver `aparencia/src/lib.rs`.
aparencia = { path = "../aparencia" }

# Os widgets, que se desenham e se descrevem do mesmo estado — ver
# `toolkit/src/lib.rs`. Testados no hospedeiro, e usados aqui pela janela.
toolkit = { path = "../toolkit" }

# O cliente TLS 1.3, sobre o `rustls` — ver `tls/src/lib.rs`. Testado no
# hospedeiro contra o servidor do `rustls` com o *ring*, e usado aqui pelo
# `programas::tls`, que lhe dá o transporte, a semente e o relógio pelo
# gate.
tls = { path = "../tls" }

# O cliente HTTP/1.1 — ver `http/src/lib.rs`. Testado no hospedeiro contra
# um transporte de mentira, e usado aqui pelo `programas::http`, que lhe dá
# a conexão do gate — direto no TCP, ou com o TLS no meio — e o nome pelo
# DNS do programa.
http = { path = "../http" }

# O Internet Computer — ver `web3/src/lib.rs`: a consulta anônima
# verificada, sem rede, testada no hospedeiro contra as bibliotecas
# oficiais da DFINITY, e usada aqui pelo `programas::icp`, que lhe dá o
# transporte — o HTTPS daqui, pela conexão que o gate decidiu —, a hora e
# o nonce, cada um pelo gate.
web3 = { path = "../web3" }

# Sem `unwind`: não há quem desenrole a pilha no espaço do usuário, e um
# pânico encerra o processo com um código — ver `src/lib.rs`.
[profile.dev]
panic = "abort"

# Os programas vão para o disco sempre em release. Não por velocidade, mas
# por tamanho: em debug o `ola` passa de 200 KiB, e cada byte é lido do
# disco a cada `executar`.
[profile.release]
panic = "abort"
opt-level = "s"
codegen-units = 1
lto = true
# Sem a tabela de símbolos no executável — o que vai para o disco. Nada a
# lê: o kernel carrega pelos cabeçalhos e pelo manifesto (`.note.duke`, que
# fica), e o `xtask simbolo` é do kernel. Ela era um sexto de cada programa
# e de cada lançamento, que passa inteiro pelo heap; e, com o P-384 e o RSA
# no TLS, os programas do IC passavam do teto de leitura do kernel, 1 MiB.
strip = "symbols"

# Os pacotes de protocolo em "z": o TLS e a PKI, o IC e o DER são
# conferência e parsing — código que roda uma vez por aperto ou por
# resposta, e não os laços dos dados, que estão nas cifras e ficam em "s".
# São o que pesa nos programas do IC: o `gestor` estava a 24 KiB do maior
# executável que o kernel lança (`protocolo::usuario::MAIOR_EXECUTAVEL`),
# e o `xtask` recusa o programa que passa dele.
[profile.release.package.rustls]
opt-level = "z"
[profile.release.package.rustls-webpki]
opt-level = "z"
[profile.release.package.rustls-pki-types]
opt-level = "z"
[profile.release.package.web3]
opt-level = "z"
[profile.release.package.der]
opt-level = "z"
[profile.release.package.const-oid]
opt-level = "z"

[workspace]
