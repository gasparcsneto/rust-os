# Integração contínua do Duke.
#
# O ponto não óbvio deste arquivo: os testes do kernel não rodam com
# `cargo test`. O harness padrão do Rust depende da `std` e de um sistema
# operacional que colete resultados, e aqui nós *somos* o sistema operacional.
#
# Em vez disso, o kernel é compilado com a feature `modo-teste`, que troca o
# laço do agente por um executor de testes. Ele roda a suíte dentro do
# emulador e o encerra com um código de saída — por `isa-debug-exit` no x86 e
# por semihosting no ARM. O `cargo xtask test` traduz esse código no sucesso
# ou falha do job.

name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  qualidade:
    name: Formatação e lints
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # O `rust-toolchain.toml` cuida de instalar o nightly com os
      # componentes e alvos certos; basta invocar o cargo.
      - name: Cache do cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            kernel/target
          key: lints-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: lints-

      # Dois workspaces separados exigem duas invocações: o da raiz não
      # alcança o kernel, que é deliberadamente excluído dele.
      - name: Formatação
        run: |
          cargo fmt --all -- --check
          (cd iniciador && cargo fmt --all -- --check)
          cd kernel && cargo fmt --all -- --check

      # O xtask roda no host, então tem testes de unidade comuns. São poucos,
      # mas cobrem a parte dele que erra em silêncio: interpretar um endereço
      # no formato errado aponta para o símbolo errado sem reclamar de nada.
      - name: Testes do xtask
        run: cargo test -p xtask

      - name: Lints
        run: |
          cargo clippy -p xtask --all-targets -- -D warnings
          for alvo in x86_64-unknown-uefi aarch64-unknown-uefi; do
            (cd iniciador && cargo clippy --target "$alvo" -- -D warnings)
          done
          cd kernel
          for alvo in x86_64-unknown-none aarch64-unknown-none-softfloat; do
            cargo clippy --target "$alvo" -- -D warnings
            cargo clippy --target "$alvo" --features modo-teste -- -D warnings
          done

      # As regras que o projeto segue e ninguém fiscalizava.
      #
      # A primeira: todo bloco `unsafe` declara a invariante de que depende.
      # É seguida em todos os blocos do projeto. Um `unsafe` sem invariante
      # escrita é um `unsafe` cuja invariante ninguém conferiu, e num kernel
      # isso volta como corrupção em outro lugar.
      #
      # A segunda: um comando do agente é descrito em três lugares — o
      # `ParamSpec` que declara o parâmetro, o `member(...)` que o handler lê,
      # e a linha da tabela do README — e os três têm de dizer o mesmo. Quando
      # divergem, nada quebra e nada avisa: o parâmetro ou não faz efeito, ou
      # é recusado antes de chegar ao handler que o usaria; e um comando fora
      # da tabela é um comando que ninguém descobre. Seis já tinham escapado
      # dela quando esta conferência entrou.
      #
      # A terceira: a árvore de arquivos do README é a árvore que existe.
      # Quando esta conferência entrou, um terço dos arquivos do projeto não
      # aparecia lá e a árvore listava um que já não existia. Um mapa errado é
      # pior que nenhum mapa.
      #
      # As três são de fonte, não precisam de alvo nem de emulador, e por isso
      # moram aqui.
      - name: Invariantes de fonte
        run: cargo xtask invariantes

      # Os links da documentação, que é onde o apodrecimento não dói até doer.
      #
      # Este projeto explica as decisões nos comentários, e um `[`Fulano`]` que
      # não resolve mais é o sintoma barato de um problema caro: o item mudou
      # de nome ou sumiu, e o texto ao lado continua descrevendo o mundo
      # antigo. Quando esta conferência entrou havia **doze** links quebrados —
      # entre eles três para um método de desenho de pixel que `Tela::retangulo`
      # absorveu, um para um módulo `serial` que virou parte de `alvo`, e um
      # `AP[2]` que o markdown lia como link por falta de crases.
      #
      # Nas quatro configurações do kernel porque `cfg` esconde itens: um link
      # válido fora do `modo-teste` pode não existir dentro dele, e um link
      # para o outro backend nunca resolve.
      - name: Documentação
        env:
          RUSTDOCFLAGS: -D rustdoc::broken_intra_doc_links
        run: |
          cargo doc --no-deps -p protocolo -p xtask
          for alvo in x86_64-unknown-uefi aarch64-unknown-uefi; do
            (cd iniciador && cargo doc --no-deps --target "$alvo")
          done
          cd kernel
          for alvo in x86_64-unknown-none aarch64-unknown-none-softfloat; do
            cargo doc --no-deps --target "$alvo"
            cargo doc --no-deps --target "$alvo" --features modo-teste
          done

  testes:
    name: Testes (${{ matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Sem fail-fast: quando uma arquitetura quebra, queremos saber na mesma
      # rodada se a outra também quebrou. Saber se o bug é específico de uma
      # plataforma costuma ser metade do diagnóstico.
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4

      - name: Cache do cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            kernel/target
          key: testes-${{ matrix.arch }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: testes-${{ matrix.arch }}-

      # O emulador e as ferramentas que montam o disco de testes.
      #
      # O disco deixou de ser um padrão que o `xtask` inventa e passou a ser
      # uma GPT de verdade, com uma ESP em FAT32 e uma raiz em Btrfs, montadas
      # por ferramentas que não têm nada a ver com este projeto. Nenhuma delas
      # precisa de privilégio: `mkfs.btrfs --rootdir` monta o sistema de
      # arquivos já com conteúdo, sem montar nada.
      - name: Instalar o emulador e as ferramentas de disco
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-system-arm \
            gdisk dosfstools mtools btrfs-progs ovmf qemu-efi-aarch64

      - name: Suíte de testes
        run: cargo xtask test --arch ${{ matrix.arch }}

      # O perfil de release exercita caminhos que o de debug não: as
      # otimizações podem expor comportamento indefinido que passa despercebido
      # sem elas, e num kernel isso costuma virar corrupção silenciosa.
      - name: Suíte de testes (release)
        run: cargo xtask test --arch ${{ matrix.arch }} --release

      # A suíte roda com a feature `modo-teste`, que **troca** o laço do agente
      # pelo executor de testes. Isso deixa fora de toda rodada verde,
      # por construção, justamente o laço que o kernel entregue roda: o
      # `Executor`, a tarefa `agent::atender`, a espera por byte via
      # interrupção e a escrita da resposta na porta.
      #
      # As peças têm caso; a composição não tinha nenhum. Este passo sobe o
      # kernel compilado como se entrega e conversa com ele pelo socket, que é
      # o que um agente de verdade faz.
      - name: Fumaça (canal do agente, kernel de produção)
        run: cargo xtask fumaca --arch ${{ matrix.arch }}

      # E em release, que é a configuração que se entrega. A suíte já roda nas
      # duas otimizações; o laço de produção só rodava numa — o mesmo formato
      # de ponto cego que a fumaça existe para fechar.
      - name: Fumaça (release)
        run: cargo xtask fumaca --arch ${{ matrix.arch }} --release

      # As imagens ELF dos programas de usuário, conferidas por fora.
      #
      # Elas são montadas à mão, byte a byte, no mesmo assembly do programa —
      # e o cabeçalho do módulo que as escreve diz, desde sempre, que a
      # fraqueza do arranjo é compensada por uma ferramenta independente:
      # "a imagem é conferida por ferramenta independente — `cargo xtask elf`
      # roda o llvm-readobj sobre os bytes embutidos".
      #
      # O comando existia e o CI nunca o rodava. A conferência acontecia
      # quando alguém a rodava à mão, o que é o mesmo que não acontecer. Dois
      # programas entraram neste projeto sem nunca passar por ela.
      #
      # Fica aqui, e não no job de qualidade, porque precisa do kernel
      # compilado para o alvo — e este job já o compila.
      - name: Imagens ELF dos programas
        run: cargo xtask elf --arch ${{ matrix.arch }}

      # O iniciador UEFI, nas duas arquiteturas e nos dois firmwares.
      #
      # Ele sobe no EDK II de verdade — OVMF de um lado, AAVMF do outro, o
      # mesmo firmware que uma máquina moderna roda — a partir da ESP do disco
      # de testes, e o passo confere o relatório número por número: contra o
      # `llvm-readobj`, contra o CRC do arquivo no hospedeiro e contra a
      # máquina que pedimos ao emulador.
      #
      # Não é o mesmo passo duas vezes. No x86 a sonda espera a linha em que o
      # kernel anuncia o framebuffer que adotou — que prova o salto e a
      # adoção. No ARM ela deixa a **suíte inteira** rodar sobre o mapa de
      # memória do firmware, que tem dezenas de regiões contra a única que o
      # device tree descreve: passar pelo `-kernel` não diz nada sobre passar
      # por aqui.
      - name: Iniciador UEFI
        run: cargo xtask iniciador --arch ${{ matrix.arch }}

      # E uma terceira, com teclado USB no lugar do nativo.
      #
      # Não é redundância: o emulador entrega cada tecla a **um** dispositivo,
      # medido — numa máquina com teclado virtio e USB, o virtio recebeu tudo
      # e o USB nada. Com os dois presentes, portanto, um dos drivers ficaria
      # sem exercício e nada acusaria, porque a sonda passaria pelo outro
      # caminho. Uma máquina por teclado é o que torna cada rodada uma
      # afirmação sobre qual driver funciona.
      - name: Fumaça (teclado USB)
        run: cargo xtask fumaca --arch ${{ matrix.arch }} --teclado usb
