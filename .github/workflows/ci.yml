# Integração contínua do Duke.
#
# O ponto não óbvio deste arquivo: os testes do kernel não rodam com
# `cargo test`. O harness padrão do Rust depende da `std` e de um sistema
# operacional que colete resultados, e aqui nós *somos* o sistema operacional.
#
# Em vez disso, o kernel é compilado com a feature `modo-teste`, que troca o
# laço do agente por um executor de testes. Ele roda a suíte dentro do
# emulador e o encerra com um código de saída — por `isa-debug-exit` no x86 e
# por semihosting no ARM. O `cargo xtask test` traduz esse código no sucesso
# ou falha do job.

name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  qualidade:
    name: Formatação e lints
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # O `rust-toolchain.toml` cuida de instalar o nightly com os
      # componentes e alvos certos; basta invocar o cargo.
      - name: Cache do cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            kernel/target
            programas/target
          key: lints-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: lints-

      # Dois workspaces separados exigem duas invocações: o da raiz não
      # alcança o kernel, que é deliberadamente excluído dele.
      - name: Formatação
        run: |
          cargo fmt --all -- --check
          (cd iniciador && cargo fmt --all -- --check)
          (cd programas && cargo fmt --all -- --check)
          cd kernel && cargo fmt --all -- --check

      # O xtask roda no host, então tem testes de unidade comuns. São poucos,
      # mas cobrem a parte dele que erra em silêncio: interpretar um endereço
      # no formato errado aponta para o símbolo errado sem reclamar de nada.
      # A tipografia também: ela é `no_std` só fora dos testes, e os dela
      # conferem a fonte — os glifos do português, o substituto e a mistura.
      # E a aparência, pelo mesmo motivo: os dela conferem o contraste de
      # cada par de texto e fundo que o sistema desenha. E o toolkit, cujo
      # layout, desenho e descrição são contas, conferidas aqui sem
      # emulador — com o leitor de descrição do protocolo, o mesmo do
      # kernel, e os testes dele junto. E o canal seguro: os vetores
      # publicados do Noise e a conversa com o `snow`, uma implementação
      # independente, nos dois papéis.
      #
      # E o cliente TLS dos programas, que conversa nos testes com o
      # servidor do `rustls` sobre o *ring* — outro provedor de cifra, outra
      # verificação de assinatura — e com uma PKI montada a cada rodada.
      #
      # E a âncora da persistência, que conversa nos testes com o `swtpm` —
      # um TPM 2.0 de verdade, a implementação de referência — e por isso
      # precisa dele instalado aqui também. Sem ele o teste falha, e não
      # pula: um teste que passa quando o que ele testa não existe mente.
      #
      # E o HTTP/2 dos programas, que conversa nos testes com o `nghttpd` —
      # o servidor da nghttp2, a biblioteca de HTTP/2 do `curl` —, pela
      # mesma razão.
      - name: O TPM e o servidor HTTP/2 dos testes do hospedeiro
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends swtpm nghttp2-server

      - name: Testes no hospedeiro
        run: cargo test -p xtask -p tipografia -p aparencia -p toolkit -p sigilo -p politica -p ancora -p diario -p armazem -p seguranca -p hora -p tls -p http -p web3 -p atualizacao -p protocolo --features protocolo/alloc,atualizacao/assinar

      - name: Lints
        run: |
          cargo clippy -p xtask -p tipografia -p aparencia -p toolkit -p sigilo -p politica -p ancora -p diario -p armazem -p seguranca -p hora -p tls -p http -p web3 -p atualizacao --all-targets -- -D warnings
          cargo clippy -p protocolo --features alloc --all-targets -- -D warnings
          for alvo in x86_64-unknown-uefi aarch64-unknown-uefi; do
            (cd iniciador && cargo clippy --target "$alvo" -- -D warnings)
          done
          for alvo in x86_64-unknown-none aarch64-unknown-none-softfloat; do
            (cd programas && cargo clippy --release --target "$alvo" -- -D warnings)
          done
          cd kernel
          for alvo in x86_64-unknown-none aarch64-unknown-none-softfloat; do
            cargo clippy --target "$alvo" -- -D warnings
            cargo clippy --target "$alvo" --features modo-teste -- -D warnings
          done

      # As regras que o projeto segue e ninguém fiscalizava.
      #
      # A primeira: todo bloco `unsafe` declara a invariante de que depende.
      # É seguida em todos os blocos do projeto. Um `unsafe` sem invariante
      # escrita é um `unsafe` cuja invariante ninguém conferiu, e num kernel
      # isso volta como corrupção em outro lugar.
      #
      # A segunda: um comando do agente é descrito em três lugares — o
      # `ParamSpec` que declara o parâmetro, o `member(...)` que o handler lê,
      # e a linha da tabela do README — e os três têm de dizer o mesmo. Quando
      # divergem, nada quebra e nada avisa: o parâmetro ou não faz efeito, ou
      # é recusado antes de chegar ao handler que o usaria; e um comando fora
      # da tabela é um comando que ninguém descobre. Seis já tinham escapado
      # dela quando esta conferência entrou.
      #
      # A terceira: a árvore de arquivos do README é a árvore que existe.
      # Quando esta conferência entrou, um terço dos arquivos do projeto não
      # aparecia lá e a árvore listava um que já não existia. Um mapa errado é
      # pior que nenhum mapa.
      #
      # As três são de fonte, não precisam de alvo nem de emulador, e por isso
      # moram aqui.
      - name: Invariantes de fonte
        run: cargo xtask invariantes

      # Os links da documentação, que é onde o apodrecimento não dói até doer.
      #
      # Este projeto explica as decisões nos comentários, e um `[`Fulano`]` que
      # não resolve mais é o sintoma barato de um problema caro: o item mudou
      # de nome ou sumiu, e o texto ao lado continua descrevendo o mundo
      # antigo. Quando esta conferência entrou havia **doze** links quebrados —
      # entre eles três para um método de desenho de pixel que `Tela::retangulo`
      # absorveu, um para um módulo `serial` que virou parte de `alvo`, e um
      # `AP[2]` que o markdown lia como link por falta de crases.
      #
      # Nas quatro configurações do kernel porque `cfg` esconde itens: um link
      # válido fora do `modo-teste` pode não existir dentro dele, e um link
      # para o outro backend nunca resolve.
      - name: Documentação
        env:
          RUSTDOCFLAGS: -D rustdoc::broken_intra_doc_links
        run: |
          cargo doc --no-deps -p protocolo -p tipografia -p aparencia -p toolkit -p sigilo -p politica -p ancora -p diario -p armazem -p seguranca -p hora -p tls -p http -p web3 -p atualizacao -p xtask --features protocolo/alloc
          for alvo in x86_64-unknown-uefi aarch64-unknown-uefi; do
            (cd iniciador && cargo doc --no-deps --target "$alvo")
          done
          for alvo in x86_64-unknown-none aarch64-unknown-none-softfloat; do
            (cd programas && cargo doc --no-deps --release --target "$alvo")
          done
          cd kernel
          for alvo in x86_64-unknown-none aarch64-unknown-none-softfloat; do
            cargo doc --no-deps --target "$alvo"
            cargo doc --no-deps --target "$alvo" --features modo-teste
          done

  testes:
    name: Testes (${{ matrix.arch }})
    runs-on: ubuntu-latest
    # O dobro do pior medido, de novo. Com as quedas nas fronteiras da
    # persistência, o job do x86 levava 34 minutos; com a compactação, o TPM
    # e o armazém, a bancada sozinha leva de 39 a 48 — o mesmo código, em
    # duas rodadas seguidas: o runner varia uns vinte por cento — e o job
    # inteiro de 58 a 70, que era o teto, e numa das rodadas foi cortado no
    # último passo. O teto ficou em 140 enquanto o job crescia — a rede, o
    # TLS, o HTTP, a suíte em virtio-gpu, e a bancada de persistência, que
    # sozinha leva 74 minutos no x86 —, e o x86 chegou a 137; com os
    # cookies, a uns 141, e foi cortado de novo no último passo. Foi a 290,
    # e com o cofre do ICP-5 o x86 levou 253 minutos em dois runners
    # lentos, 123 deles na bancada de persistência: ela foi para um job à
    # parte, `persistencia`, ao lado deste, e este voltou a uns 100. Os
    # casos do gestor de canisters o levaram a 144 no x86 (CI 335), 39
    # deles na suíte em virtio-gpu, que foi para o job `video`.
    timeout-minutes: 290
    strategy:
      # Sem fail-fast: quando uma arquitetura quebra, queremos saber na mesma
      # rodada se a outra também quebrou. Saber se o bug é específico de uma
      # plataforma costuma ser metade do diagnóstico.
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4

      - name: Cache do cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            kernel/target
            programas/target
          key: testes-${{ matrix.arch }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: testes-${{ matrix.arch }}-

      # O emulador e as ferramentas que montam o disco de testes.
      #
      # O disco deixou de ser um padrão que o `xtask` inventa e passou a ser
      # uma GPT de verdade, com uma ESP em FAT32 e uma raiz em Btrfs, montadas
      # por ferramentas que não têm nada a ver com este projeto. Nenhuma delas
      # precisa de privilégio: `mkfs.btrfs --rootdir` monta o sistema de
      # arquivos já com conteúdo, sem montar nada.
      #
      # E o Python 3, que o runner já traz: o servidor da bancada TLS é o
      # módulo `ssl` dele — o OpenSSL, uma implementação inteira de fora —,
      # que o emulador roda a cada conexão ao eco TLS. Pedido aqui para que
      # a dependência esteja escrita, e não só presente por acaso.
      - name: Instalar o emulador e as ferramentas de disco
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-system-arm \
            gdisk dosfstools mtools btrfs-progs ovmf qemu-efi-aarch64 \
            swtpm python3

      - name: Suíte de testes
        run: cargo xtask test --arch ${{ matrix.arch }}

      # O perfil de release exercita caminhos que o de debug não: as
      # otimizações podem expor comportamento indefinido que passa despercebido
      # sem elas, e num kernel isso costuma virar corrupção silenciosa.
      - name: Suíte de testes (release)
        run: cargo xtask test --arch ${{ matrix.arch }} --release

      # A suíte roda com a feature `modo-teste`, que **troca** o laço do agente
      # pelo executor de testes. Isso deixa fora de toda rodada verde,
      # por construção, justamente o laço que o kernel entregue roda: o
      # `Executor`, a tarefa `agent::atender`, a espera por byte via
      # interrupção e a escrita da resposta na porta.
      #
      # As peças têm caso; a composição não tinha nenhum. Este passo sobe o
      # kernel compilado como se entrega e conversa com ele pelo socket, que é
      # o que um agente de verdade faz.
      - name: Fumaça (canal do agente, kernel de produção)
        run: cargo xtask fumaca --arch ${{ matrix.arch }}

      # E em release, que é a configuração que se entrega. A suíte já roda nas
      # duas otimizações; o laço de produção só rodava numa — o mesmo formato
      # de ponto cego que a fumaça existe para fechar.
      - name: Fumaça (release)
        run: cargo xtask fumaca --arch ${{ matrix.arch }} --release

      # As imagens ELF dos programas de usuário, conferidas por fora.
      #
      # Elas são montadas à mão, byte a byte, no mesmo assembly do programa —
      # e o cabeçalho do módulo que as escreve diz, desde sempre, que a
      # fraqueza do arranjo é compensada por uma ferramenta independente:
      # "a imagem é conferida por ferramenta independente — `cargo xtask elf`
      # roda o llvm-readobj sobre os bytes embutidos".
      #
      # O comando existia e o CI nunca o rodava. A conferência acontecia
      # quando alguém a rodava à mão, o que é o mesmo que não acontecer. Dois
      # programas entraram neste projeto sem nunca passar por ela.
      #
      # Fica aqui, e não no job de qualidade, porque precisa do kernel
      # compilado para o alvo — e este job já o compila.
      - name: Imagens ELF dos programas
        run: cargo xtask elf --arch ${{ matrix.arch }}

      # O iniciador UEFI, nas duas arquiteturas e nos dois firmwares.
      #
      # Ele sobe no EDK II de verdade — OVMF de um lado, AAVMF do outro, o
      # mesmo firmware que uma máquina moderna roda — a partir da ESP do disco
      # de testes, e o passo confere o relatório número por número: contra o
      # `llvm-readobj`, contra o CRC do arquivo no hospedeiro e contra a
      # máquina que pedimos ao emulador.
      #
      # Não é o mesmo passo duas vezes. No x86 a sonda espera a linha em que o
      # kernel anuncia o framebuffer que adotou — que prova o salto e a
      # adoção. No ARM ela deixa a **suíte inteira** rodar sobre o mapa de
      # memória do firmware, que tem dezenas de regiões contra a única que o
      # device tree descreve: passar pelo `-kernel` não diz nada sobre passar
      # por aqui.
      - name: Iniciador UEFI
        run: cargo xtask iniciador --arch ${{ matrix.arch }}

      # E uma terceira, com teclado USB no lugar do nativo.
      #
      # Não é redundância: o emulador entrega cada tecla a **um** dispositivo,
      # medido — numa máquina com teclado virtio e USB, o virtio recebeu tudo
      # e o USB nada. Com os dois presentes, portanto, um dos drivers ficaria
      # sem exercício e nada acusaria, porque a sonda passaria pelo outro
      # caminho. Uma máquina por teclado é o que torna cada rodada uma
      # afirmação sobre qual driver funciona.
      - name: Fumaça (teclado USB)
        run: cargo xtask fumaca --arch ${{ matrix.arch }} --teclado usb

  # A máquina que só tem `virtio-gpu`: sem VGA, sem `bochs`, sem tela
  # linear deixada pelo firmware. É outro caminho de tela no kernel — ele
  # escreve numa memória que o dispositivo só lê quando mandado —, e cada
  # uma das duas conferências vê o que a outra não vê.
  #
  # A suíte confere o que o kernel mandou: que só o dano atravessou, que
  # uma recusa do dispositivo virou erro. A fumaça fotografa o monitor
  # pelo `screendump` do emulador e compara com o que o kernel diz ter
  # desenhado. Medido com mutações: transferir a tela inteira a cada
  # escrita só a suíte reprova, porque a tela sai certa; errar o
  # deslocamento ou o formato do pixel só a fumaça reprova, porque o
  # kernel acredita ter mandado certo.
  #
  # Um job à parte, como as bancadas: a suíte inteira de novo, com outra
  # placa, levava de 26 a 39 minutos dentro do job de testes (CI 330 e
  # 335). A cobertura é a mesma, ao lado dele. O teto é o dobro do pior
  # medido com a compilação.
  video:
    name: Tela virtio-gpu (${{ matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4

      - name: Cache do cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            kernel/target
            programas/target
          key: video-${{ matrix.arch }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          # Sem um cache seu ainda, o do job de testes: a mesma compilação.
          restore-keys: |
            video-${{ matrix.arch }}-
            testes-${{ matrix.arch }}-

      # As mesmas da máquina do job de testes: o disco, o TPM e a rede.
      - name: Instalar o emulador e as ferramentas de disco
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-system-arm \
            gdisk dosfstools mtools btrfs-progs ovmf qemu-efi-aarch64 \
            swtpm python3

      - name: Suíte de testes (virtio-gpu)
        run: cargo xtask test --arch ${{ matrix.arch }} --video virtio

      - name: Fumaça (virtio-gpu)
        run: cargo xtask fumaca --arch ${{ matrix.arch }} --video virtio

  # A persistência só aparece entre boots: a mesma máquina, ligada de novo
  # sobre o mesmo disco e o mesmo TPM, depois de um corte de energia —
  # `SIGKILL` no emulador e no TPM, sem aviso. A bancada também fotografa a
  # partição de estado e a devolve ao disco, que é como se simula um disco
  # restaurado de uma cópia antiga. Ver `docs/PERSISTENCIA.md`.
  #
  # Um job à parte, como a bancada de tempo, e pelo mesmo motivo: ela leva
  # de 96 a 123 minutos no x86, e dentro do job de testes empurrava o x86
  # para 253 dos 290 minutos do teto, com o runner variando uns vinte por
  # cento. A cobertura é a mesma — os mesmos cenários, a mesma máquina —, e
  # corre ao lado dos testes, sem esticá-los. O teto é o dobro do pior
  # medido com a compilação.
  persistencia:
    name: Persistência (${{ matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 270
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4

      - name: Cache do cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            kernel/target
            programas/target
          key: persistencia-${{ matrix.arch }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: persistencia-${{ matrix.arch }}-

      # As mesmas da máquina do job de testes: o disco, o TPM e a rede.
      - name: Instalar o emulador e as ferramentas de disco
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-system-arm \
            gdisk dosfstools mtools btrfs-progs ovmf qemu-efi-aarch64 \
            swtpm python3

      - name: Persistência
        run: cargo xtask persistencia --arch ${{ matrix.arch }}

  # A atualização A/B (B1, `docs/ATUALIZACAO.md`): a máquina de produção
  # sempre pelo firmware — o OVMF no x86, o AAVMF no ARM —, o iniciador, o
  # controle de boot e os slots do disco de testes. A versão nova escrita,
  # instalada pelo quórum, tentada, confirmada ou desfeita; o controle
  # forjado e a versão velha reescrita, recusados abaixo do piso; as
  # recusas da instalação; a concorrência; sem TPM e com outro; o caminho
  # do operador numa imagem de produção, com a identidade nascida no
  # primeiro boot; e, sobre o kernel com os pontos de queda, o corte de
  # energia em cada fronteira da instalação, da confirmação, da escrita e
  # do desfazimento, e o pânico em toda tentativa — numa imagem de produção
  # também, que volta com a identidade dela.
  # Um job à parte, como a persistência: cada cenário é uma série de boots.
  atualizacao:
    name: Atualização (${{ matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4

      - name: Cache do cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            kernel/target
            programas/target
          key: atualizacao-${{ matrix.arch }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: atualizacao-${{ matrix.arch }}-

      - name: Instalar o emulador e as ferramentas de disco
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-system-arm \
            gdisk dosfstools mtools btrfs-progs ovmf qemu-efi-aarch64 \
            swtpm python3

      - name: Atualização A/B
        run: cargo xtask atualizacao --arch ${{ matrix.arch }}

  # A bancada da identidade do Duke (B2): a imagem de produção do
  # `provisionar`, sem chave do Duke nenhuma, pelo firmware, num disco e
  # num TPM novos por cenário. A identidade nasce no primeiro boot, selada
  # no TPM, e a máquina a mostra; os boots seguintes a abrem do selo; a
  # energia cai em cada passo do nascimento; as cópias do selo estragadas,
  # a máquina sem TPM, o disco clonado noutra máquina e a reinstalação —
  # com o TPM limpo e sem ele — não fazem nascer outra por cima. Um job à
  # parte, como a persistência e a atualização: cada cenário é uma série de
  # boots pelo firmware.
  identidade:
    name: Identidade (${{ matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4

      - name: Cache do cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            kernel/target
            programas/target
          key: identidade-${{ matrix.arch }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: identidade-${{ matrix.arch }}-

      - name: Instalar o emulador e as ferramentas de disco
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-system-arm \
            gdisk dosfstools mtools btrfs-progs ovmf qemu-efi-aarch64 \
            swtpm python3

      - name: Identidade do Duke
        run: cargo xtask identidade --arch ${{ matrix.arch }}

  # A bancada de tempo (desenho do incremento 7, §15.2): o Roughtime de ponta
  # a ponta, uma máquina por cenário. O fio `hora` do kernel pede cada passo
  # ao gate; o pedido sai pela placa, a rede do emulador o leva ao loopback
  # do runner, e o servidor do `xtask` — três fontes, com as raízes de
  # `target/chaves/` e um escritor de mensagens que não é o do kernel —
  # responde. A suíte confere as respostas ruins com servidores de dentro da
  # máquina e não move a hora; aqui a hora se move: o RTC adiantado e
  # atrasado, as fontes que pulam, calam, atrasam e divergem, o firewall, a
  # política tirando `time.sync` no meio de uma rodada, o teto da incerteza,
  # o holdover. Um job à parte porque a bancada leva mais de uma hora — o
  # holdover sozinho espera a janela de 34 minutos — e corre ao lado do de
  # testes, sem esticá-lo.
  tempo:
    name: Bancada de tempo (${{ matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4

      - name: Cache do cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            kernel/target
            programas/target
          key: tempo-${{ matrix.arch }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: tempo-${{ matrix.arch }}-

      # As mesmas da máquina do job de testes: a bancada sobe o kernel de
      # produção com o disco, o TPM e a rede da fumaça.
      - name: Instalar o emulador e as ferramentas de disco
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-system-arm \
            gdisk dosfstools mtools btrfs-progs ovmf qemu-efi-aarch64 \
            swtpm python3

      - name: Bancada de tempo
        run: cargo xtask tempo --arch ${{ matrix.arch }} --release
