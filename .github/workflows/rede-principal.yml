# A fumaça real da rede principal do IC: `cargo xtask mainnet` — ver
# `docs/ICP.md`, "A rede principal (ICP-4b)".
#
# Fora da CI, de propósito: a CI não depende da rede principal — a suíte
# confere o caminho inteiro com a bancada, sem ela —, e este fluxo só roda
# quando alguém o pede, pelo botão "Run workflow" da aba Actions. O GitHub
# só oferece o botão para um fluxo que está no ramo padrão; o ramo que
# roda é o que se escolhe nele. Só leitura: uma consulta anônima ao
# livro-razão do ICP, e nada que mude estado na rede principal.
#
# O runner tem o que a fumaça precisa e uma máquina atrás de um proxy não
# tem: DNS de verdade e a porta 443 sem ninguém reabrindo o TLS. O
# relatório sai no log e como artefato.
name: Rede principal (fumaça real)

on:
  workflow_dispatch:
    inputs:
      arch:
        description: A arquitetura da máquina
        type: choice
        options: [x86_64, aarch64]
        default: x86_64
  # Temporário: a fumaça real do ICP-4b roda pelo empurrão deste arquivo, e
  # só dele, neste ramo — o fluxo não está no ramo padrão, onde o botão
  # aparece. O commit seguinte tira o gatilho.
  push:
    branches: [claude/modest-pascal-vy8p8k]
    paths: [.github/workflows/rede-principal.yml]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  mainnet:
    name: A rede principal do IC (${{ inputs.arch || 'x86_64' }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Cache do cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            kernel/target
            programas/target
          key: mainnet-${{ inputs.arch || 'x86_64' }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: mainnet-${{ inputs.arch || 'x86_64' }}-

      # As mesmas da fumaça: o kernel de produção com o disco, o TPM e a
      # rede do emulador. O `openssl` é do pré-voo, que lê a cadeia real.
      - name: Instalar o emulador e as ferramentas de disco
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-system-arm \
            gdisk dosfstools mtools btrfs-progs ovmf qemu-efi-aarch64 \
            swtpm python3 openssl

      # Temporário, com o gatilho: pelo empurrão, o comando do ICP-4b como
      # está, no x86_64. O `target/mainnet/` começa vazio: o cache traz o
      # `target/` de uma rodada anterior, com o relatório dela.
      - name: A fumaça real
        run: |
          rm -rf target/mainnet
          cargo xtask mainnet --release

      - name: O relatório
        if: always()
        run: cat target/mainnet/relatorio-*.md || true

      - name: O relatório, como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-mainnet-${{ inputs.arch || 'x86_64' }}
          path: target/mainnet/relatorio-*.md
          if-no-files-found: ignore
