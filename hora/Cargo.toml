[package]
name = "hora"
version = "0.1.0"
edition = "2024"
description = "A hora do Duke: o Roughtime (RFC 10049, versão 1) conferido e o relógio civil disciplinado"
license = "MIT OR Apache-2.0"

# Só as contas: nenhum relógio, nenhuma rede, nenhuma trava — quem chama dá os
# bytes que chegaram e os instantes do contador. As versões são as que o
# `sigilo` já usa: nada novo entra no `Cargo.lock`.
[dependencies]
ed25519-dalek = { version = "3.0.0", default-features = false }
sha2 = { version = "0.11.0", default-features = false }

# A aritmética da curva, só para os casos que montam uma chave fraca de
# propósito — a mesma versão que o `ed25519-dalek` já traz.
[dev-dependencies]
curve25519-dalek = { version = "5.0.0", default-features = false }
