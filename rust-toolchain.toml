# O compilador oficial do Duke OS: um nightly com data, o mesmo em toda
# sessão, worktree, agente e job da CI — ver "O compilador" no CLAUDE.md.
#
# **Nightly**, porque o kernel usa a `abi_x86_interrupt`: a ABI de chamada
# que o processador usa ao invocar um handler de interrupção (o retorno é
# `iretq`, não `ret`). O `modo-teste` usa também o `cfg_overflow_checks`.
#
# **Com data**, porque um `nightly` sem data é outro compilador a cada
# instalação: a CI 496 reprovou com o código da 495 só porque o clippy de um
# nightly mais novo — o `5f4effd57`, no lugar do `8eb778d04` da 495 — passou
# a acusar o `unnecessary_to_owned` num trecho que o anterior aceitava; e o
# ELF da CI 492 não se reconstruía, com o compilador daquela execução entre
# os motivos. A data muda só por uma promoção — um commit próprio, que troca
# este arquivo e o `sdk/modelo/rust-toolchain.toml` juntos, depois do
# canário com o candidato, e com a CI completa verde nele (o procedimento
# está no CLAUDE.md). O `cargo xtask invariantes` confere que o canal tem data e é o
# mesmo nos dois arquivos; o `cargo xtask` recusa rodar com outro
# compilador sem o opt-in explícito de uma execução não oficial.
#
# `targets` garante que os alvos bare-metal sejam instalados automaticamente
# por quem clonar o repositório — sem passo manual de `rustup target add`.
#
# **Os dois precisam estar aqui.** Faltava o do ARM, e a consequência não
# aparecia em nenhuma máquina de desenvolvimento: quem já tinha o alvo
# instalado por outro motivo compilava normalmente, e o CI, que parte de uma
# imagem limpa, falhava em *todo* job de aarch64 antes de compilar uma linha do
# kernel — com um erro que fala de `core`, e não do alvo que falta.
#
# É a espécie de defeito que sobrevive justamente por não incomodar quem
# poderia corrigi-lo.
[toolchain]
channel = "nightly-2026-11-15"
components = ["rust-src", "llvm-tools", "rustfmt", "clippy"]
targets = [
    "x86_64-unknown-none",
    "aarch64-unknown-none-softfloat",
    # Os alvos do iniciador UEFI, um por arquitetura. Não são alvos
    # bare-metal: uma aplicação EFI é um PE/COFF com ABI própria, carregado
    # pelo firmware — e é o **mesmo** programa nos dois, porque a UEFI é a
    # mesma especificação nas duas máquinas.
    "x86_64-unknown-uefi",
    "aarch64-unknown-uefi",
]
profile = "minimal"
