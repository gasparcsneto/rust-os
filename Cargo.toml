# Workspace do *host*. Contém apenas as ferramentas que rodam na sua máquina.
#
# O `kernel` e o `iniciador` são deliberadamente excluídos: o primeiro compila
# para `x86_64-unknown-none` (bare-metal, sem sistema operacional por baixo), o
# segundo para `x86_64-unknown-uefi` (uma aplicação do firmware), e o `xtask`
# para o host. Um único workspace não consegue ter três targets padrão, então
# separamos os três — o `xtask` invoca os outros dois builds explicitamente.
[workspace]
resolver = "3"
members = ["ancora", "aparencia", "armazem", "atualizacao", "diario", "hora", "http", "politica", "protocolo", "seguranca", "sigilo", "tipografia", "tls", "toolkit", "web3", "xtask"]
# O `kernel` compila para bare-metal e o `iniciador` para UEFI. Cada um é seu
# próprio workspace; o `xtask` invoca os dois builds explicitamente.
#
# O `protocolo` e a `tipografia` são membros daqui, e não excluídos: são
# bibliotecas `no_std` que compilam para qualquer alvo, e os outros as incluem
# por caminho. Ser membro é o que põe o `cargo fmt`, o `cargo clippy` e os
# testes da raiz em cima delas.
exclude = ["kernel", "iniciador"]

# A aritmética do RSA otimizada mesmo no build de depuração: os testes do
# `tls` e a bancada TLS do `xtask` geram chaves RSA, e gerar uma de 4096
# bits sem otimização leva minutos. Só no hospedeiro — os programas do Duke
# são do workspace deles, e compilam sempre em release.
[profile.dev.package.rsa]
opt-level = 3

[profile.dev.package.crypto-bigint]
opt-level = 3

[profile.dev.package.crypto-primes]
opt-level = 3
