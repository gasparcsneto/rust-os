[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
publish = false
description = "Build system do projeto: compila o kernel, gera as imagens de disco e roda o QEMU"

[dependencies]
# Só o contrato deste projeto: a base do kernel no espaço virtual, que o
# `xtask` precisa para traduzir o `pc` de uma falha em arquivo e linha. É a
# mesma constante que o kernel e o iniciador leem, e não uma cópia. E o
# leitor de JSON, com os arrays: a bancada de tempo lê o `system.info time`,
# o `log.tail` e o `security.status` por ele.
protocolo = { path = "../protocolo", features = ["arrays"] }

# O canal seguro, do lado do cliente: o mesmo Noise que o kernel faz do lado
# dele, e o formato dos arquivos de chaves que o `xtask` grava na imagem.
sigilo = { path = "../sigilo" }

# A política padrão que vai para a imagem, e a conferência da cadeia de
# auditoria que a fumaça recalcula do lado de fora.
politica = { path = "../politica" }

# O formato do journal, para a bancada achar as regiões da partição de
# estado e os registros nelas, pelo cabeçalho em claro — sem a chave.
diario = { path = "../diario" }

# O registro de fontes de hora que vai para a imagem: o mesmo leitor que o
# kernel usa no boot, e a coerência dele com a política — conferidos antes
# de a imagem existir.
hora = { path = "../hora" }

# As raízes das fontes de hora da bancada: a pública de cada uma sai da
# privada, que fica em `target/chaves/`. A mesma versão do `sigilo`.
ed25519-dalek = { version = "3.0.0", default-features = false }

# O resumo das fontes de hora da bancada: a árvore de Merkle e o `SRV` do
# servidor do `xtask` (`src/servidor_de_hora.rs`), escritos à parte do
# pacote `hora`. A mesma versão do `hora`: nada novo entra no `Cargo.lock`.
sha2 = { version = "0.11.0", default-features = false }

# Os certificados da bancada TLS: a raiz, as folhas, a vencida e a de outra
# raiz — gerados em `target/`, nunca no repositório. Ver `src/tls.rs`.
rcgen = "0.14.10"

# De fora, nenhuma. O `xtask` monta o disco com as ferramentas do hospedeiro —
# `sgdisk`, `mkfs.vfat`, `mcopy`, `mkfs.btrfs` — e o que boota é o iniciador
# deste projeto, compilado como mais um alvo.
#
# Aqui morava o crate `bootloader`, que gerava as imagens de BIOS e de UEFI.
# Ele saiu quando o `iniciador/` passou a pôr o kernel de pé sozinho.
